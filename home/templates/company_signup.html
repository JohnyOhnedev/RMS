{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Resume Checker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'loginstyle.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <h1><i class="fas fa-user-plus"></i> Company Signup</h1>
        <p>Register your company to access resume management features.</p>
        
        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}
        {% if message %}
            <p class="success-message">{{ message }}</p>
        {% endif %}

        
        <form method="post" >
            {% csrf_token %}
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group">
                <label for="company_name"><i class="fas fa-building"></i> Company Name</label>
                <input type="text" id="company_name" name="company_name" placeholder="Enter your company name" required>
            </div>
            <button type="submit" class="login-btn">
                <i class="fas fa-user-check"></i> Sign Up
            </button>
        </form>
    </div>
</body>
</html>
