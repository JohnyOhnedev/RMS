<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Skill Analyzer</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><i class="fas fa-check-circle"></i> ResumeChecker</div>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="{% url 'features' %}"><i class="fas fa-home"></i> Features</a></li>
                <!-- <li><a href="#"><i class="fas fa-star"></i> Features</a></li>
                <li><a href="testimonial.html"><i class="fas fa-comments"></i> Testimonials</a></li>
                <li><a href="#"><i class="fas fa-envelope"></i> Contact</a></li> -->
            </ul>
        </nav>
    </header>
    <h2>📄 Resume Skill Analyzer</h2>

    {% if error %}
        <p style="color: red;">Error: {{ error }}</p>
    {% endif %}

    <form id="resume-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume" required>
        <button type="submit">Analyze</button>
    </form>

    <h3>🔹 Extracted Skills:</h3>
    <ul id="skills"></ul>

    <h3>📚 Recommended Courses:</h3>
    <ul id="course-list"></ul>

    <script>
        $(document).ready(function() {
            $("#resume-form").submit(function(event) {
                event.preventDefault();
                var formData = new FormData();
                formData.append("resume", $("#resume")[0].files[0]);

                $.ajax({
                    url: "{% url 'upload_resume' %}",
                    type: "POST",
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        $("#skills").html(response.skills.map(skill => `<li>${skill}</li>`).join(""));
                        $("#course-list").html(response.courses.map(course => `<li>${course}</li>`).join(""));
                    },
                    error: function(xhr) {
                        alert("Error processing resume: " + xhr.responseJSON.error);
                    }
                });
            });
        });
    </script>
</body>
</html>
