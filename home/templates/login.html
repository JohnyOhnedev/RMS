{% extends "base.html" %}

{% block title %}Login - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="card" style="max-width:440px; margin:40px auto;">
    <h2><i class="fas fa-sign-in-alt" style="color:var(--brand);"></i> Sign in</h2>
    <p style="color:var(--muted);">Access your dashboard and resume tools.</p>

    <form method="post" action="{% url 'home:login' %}">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn btn-primary" style="margin-top:20px; width:100%;">Sign in</button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:14px;">
        No account? <a href="{% url 'home:signup' %}">Create one</a> &middot;
        <a href="{% url 'home:company_login' %}">Company login</a>
    </p>
</section>
{% endblock %}
