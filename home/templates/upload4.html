{% extends "base.html" %}

{% block title %}Interview plan - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="card" style="max-width:620px; margin:30px auto;">
    <h2><i class="fas fa-comments" style="color:var(--brand);"></i> Interview plan generator</h2>
    <p style="color:var(--muted);">
        Build a tailored interview plan for a candidate from their resume.
    </p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="resume">Candidate resume</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.docx,.txt,.md,.rtf" required>
        <div class="help">Accepted: PDF, DOCX, TXT. Maximum 8 MB.</div>
        <button type="submit" class="btn btn-primary" style="margin-top:18px; width:100%;">
            <i class="fas fa-list-check"></i> Generate interview plan
        </button>
    </form>
</section>
{% endblock %}
