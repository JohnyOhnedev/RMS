<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval Pending</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
        }
        p {
            color: #666;
        }
        .status {
            font-weight: bold;
            color: orange;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Approval Pending</h2>
        <p>Your company registration is currently under review.</p>
        <p class="status">Status: Pending Approval</p>
        <p>Please wait for admin approval. You will receive an email once your company is approved.</p>
        <p><a href="{% url 'company_login' %}">Return to Login</a></p>
    </div>

</body>
</html>
