{% extends "base.html" %}

{% block title %}Approval pending - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="card" style="max-width:560px; margin:60px auto; text-align:center;">
    <i class="fas fa-hourglass-half" style="font-size:44px; color:var(--warn);"></i>
    <h2>Approval pending</h2>
    <p style="color:var(--muted);">
        Your company registration is still being reviewed by an administrator.
        You will receive an email as soon as it is approved.
    </p>
    <a class="btn btn-primary" href="{% url 'home:home' %}">Back to home</a>
</section>
{% endblock %}
