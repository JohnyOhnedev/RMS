<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2980, #26d0ce, #141e30);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            /* color: #ffffff; */
            /* color: #0f1e8b; */
            color:#1a2980;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Header Styling */
        header {
            width: 100%;
            padding: 20px 0;
            background: linear-gradient(to right, rgba(26, 41, 128, 0.95), rgba(38, 208, 206, 0.95));
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0px 0px 15px #26d0ce;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 1.5rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #26d0ce;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        .nav-links a:hover {
            color: #26d0ce;
        }

        .nav-links a:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* Main Container Styling */
        .result-container {
            margin: 150px auto;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
            backdrop-filter: blur(10px);
            animation: fadeInResult 2s ease forwards;
        }

        @keyframes fadeInResult {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0px); }
        }

        .result-container h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0px 0px 15px #26d0ce;
        }

        .result-content {
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .result-container a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #4CAF50, #2ECC71);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            border-radius: 5px;
            text-align: center;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .result-container a:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #2ECC71, #4CAF50);
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><i class="fas fa-check-circle"></i> ResumeChecker</div>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="{% url 'features' %}"><i class="fas fa-star"></i> Features</a></li>
                <!-- <li><a href="testimonial.html"><i class="fas fa-comments"></i> Testimonials</a></li>
                <li><a href="#"><i class="fas fa-envelope"></i> Contact</a></li> -->
            </ul>
        </nav>
    </header>
    <section class="result-container">
        <h1><i class="fas fa-clipboard-list"></i>Recommendations</h1>
        <div class="result-content">
            {{ recommendations }}
        </div>
        <!--Analyze another resume-->
    </section>
</body>
</html>
