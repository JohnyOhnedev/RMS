<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }
        form {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            width: 50%;
        }
        input, button {
            margin-top: 10px;
            padding: 8px;
            width: 100%;
        }
        .message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>

<script>
    function uploadResume(event) {
        event.preventDefault();
        
        let formData = new FormData();
        let fileInput = document.getElementById("resume");
        let messageBox = document.getElementById("message");

        if (fileInput.files.length === 0) {
            messageBox.innerHTML = "<p style='color: red;'>Please select a file.</p>";
            return;
        }

        formData.append("resume", fileInput.files[0]);

        fetch("/upload-resume/", {
            method: "POST",
            body: formData,
        })
        .then(response => response.json())
        .then(data => {
            console.log("Server Response:", data); // Logs server response to browser console
            
            if (data.error) {
                messageBox.innerHTML = `<p style='color: red;'>${data.error}</p>`;
            } else {
                messageBox.innerHTML = `<p style='color: green;'>${data.message}</p>`;
                fileInput.value = ""; // Reset file input after successful upload
            }
        })
        .catch(error => {
            console.error("Upload error:", error);
            messageBox.innerHTML = "<p style='color: red;'>Error uploading file. Check the console for details.</p>";
        });
    }
</script>

</head>
<body>

    <h2>Upload Your Resume</h2>
    <form onsubmit="uploadResume(event)">
        <label for="resume"><strong>Select Resume (PDF/DOCX only):</strong></label>
        <input type="file" id="resume" name="resume" accept=".pdf,.docx" required>
        <button type="submit">Upload</button>
    </form>

    <div id="message" class="message"></div>

</body>
</html>
