{% extends "base.html" %}

{% block title %}Resume review - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="card" style="max-width:620px; margin:30px auto;">
    <h2><i class="fas fa-magnifying-glass-chart" style="color:var(--brand);"></i> Resume review</h2>
    <p style="color:var(--muted);">
        Get an ATS score out of 100, a breakdown by section and a prioritised list of improvements.
    </p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="resume">Choose your resume</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.docx,.txt,.md,.rtf" required>
        <div class="help">Accepted: PDF, DOCX, TXT. Maximum 8 MB.</div>
        <button type="submit" class="btn btn-primary" style="margin-top:18px; width:100%;">
            <i class="fas fa-wand-magic-sparkles"></i> Analyze resume
        </button>
    </form>
</section>
{% endblock %}
