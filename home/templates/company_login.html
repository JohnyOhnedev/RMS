{% extends "base.html" %}

{% block title %}Company login - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="card" style="max-width:440px; margin:40px auto;">
    <h2><i class="fas fa-building" style="color:var(--brand);"></i> Company login</h2>

    {% if error %}
        <div class="messages"><li class="error">{{ error }}</li></div>
    {% endif %}

    <form method="post" action="{% url 'home:company_login' %}">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn btn-primary" style="margin-top:20px; width:100%;">Sign in</button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:14px;">
        Not registered? <a href="{% url 'home:company_signup' %}">Register your company</a>
    </p>
</section>
{% endblock %}
