{% extends "base.html" %}

{% block title %}Login — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="card reveal" data-tilt style="max-width:440px; margin:36px auto;">
    <div style="text-align:center; margin-bottom:6px;">
        <span class="icon-tile" style="width:54px; height:54px; font-size:22px;"><i class="fas fa-building"></i></span>
    </div>
    <h2 style="text-align:center;">Company login</h2>
    <p style="color:var(--muted); text-align:center; margin-bottom:6px;">Access your recruiting dashboard.</p>

    {% if error %}
        <div class="messages"><li class="error">{{ error }}</li></div>
    {% endif %}

    <form method="post" action="{% url 'home:company_login' %}">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn btn-primary" style="margin-top:22px; width:100%;">
            <i class="fas fa-arrow-right-to-bracket"></i> Sign in
        </button>
    </form>

    <p style="text-align:center; margin-top:20px; font-size:14px;">
        Not registered? <a href="{% url 'home:company_signup' %}">Register your company</a>
    </p>
</section>
{% endblock %}
