{% extends "base.html" %}

{% block title %}Learning resources — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="card reveal" style="max-width:640px; margin:30px auto;">
    <div style="text-align:center; margin-bottom:6px;">
        <span class="icon-tile" style="width:54px; height:54px; font-size:22px;"><i class="fas fa-book"></i></span>
    </div>
    <h2 style="text-align:center;">Learning resources</h2>
    <p style="color:var(--muted); text-align:center;">
        Upload your resume and we'll suggest courses for the fields your skills point to.
    </p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="resume">Choose your resume</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.docx,.txt,.md,.rtf" required>
        <div class="help">Accepted: PDF, DOCX, TXT &middot; Maximum 8 MB</div>
        <button type="submit" class="btn btn-primary" style="margin-top:20px; width:100%;">
            <i class="fas fa-graduation-cap"></i> Recommend resources
        </button>
    </form>
</section>
{% endblock %}
