{% extends "base.html" %}

{% block title %}Learning resources - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="card" style="max-width:620px; margin:30px auto;">
    <h2><i class="fas fa-book" style="color:var(--brand);"></i> Learning resources</h2>
    <p style="color:var(--muted);">
        Upload your resume and we will suggest courses for the fields your skills point to.
    </p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="resume">Choose your resume</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.docx,.txt,.md,.rtf" required>
        <div class="help">Accepted: PDF, DOCX, TXT. Maximum 8 MB.</div>
        <button type="submit" class="btn btn-primary" style="margin-top:18px; width:100%;">
            <i class="fas fa-graduation-cap"></i> Recommend resources
        </button>
    </form>
</section>
{% endblock %}
