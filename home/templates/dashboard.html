<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard</title>

    <script>
        function fetchSkills() {
            let jobRole = document.getElementById("job_role").value.trim();

            if (jobRole) {
                fetch(`/fetch-skills/?job_role=${encodeURIComponent(jobRole)}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.skills) {
                            document.getElementById("existing_skills").innerHTML = `<strong>Existing Skills:</strong> ${data.skills}`;
                        } else {
                            document.getElementById("existing_skills").innerHTML = "<strong>No existing skills found.</strong>";
                        }
                        document.getElementById("skills").value = ""; // Always clear the textarea
                    })
                    .catch(error => console.error("Error fetching skills:", error));
            } else {
                document.getElementById("existing_skills").innerHTML = ""; // Clear if no input
            }
        }
    </script>

<div id="resume_results"></div>

<script>
    function searchResumes(event) {
        event.preventDefault();
        let jobRole = document.getElementById("search_job_role").value.trim();
        let resultContainer = document.getElementById("resume_results");

        if (!jobRole) {
            resultContainer.innerHTML = "<p style='color: red;'>Please enter a job role.</p>";
            return;
        }

        fetch(`/search-resumes/?job_role=${encodeURIComponent(jobRole)}`)
            .then(response => response.json())
            .then(data => {
                if (data.resumes.length > 0) {
                    let results = "<h3>Matching Resumes</h3><ul>";
                    data.resumes.forEach(resume => {
                        results += `<li>
                            <strong>Score: ${resume.score.toFixed(2)}</strong><br>
                            <a href="${resume.file_url}" target="_blank">Download Resume</a>
                        </li>`;
                    });
                    results += "</ul>";
                    resultContainer.innerHTML = results;
                } else {
                    resultContainer.innerHTML = "<p style='color: red;'>No matching resumes found.</p>";
                }
            })
            .catch(error => console.error("Error fetching resumes:", error));
    }
</script>
